<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hiraku Judges Translator — PDF</title>
  <link rel="icon" href="../icons/icon16.png">
  <link rel="stylesheet" href="reader.css">
</head>
<body data-layout="split" data-state="empty">
  <header class="bar">
    <img src="../icons/icon48.png" alt="" class="logo">
    <div class="name" id="docTitle">Hiraku Judges Translator</div>
    <select id="toc" hidden aria-label="TOC"></select>
    <div class="grow"></div>
    <span class="status" id="status" role="status" aria-live="polite"></span>
    <button id="translate" class="primary" type="button" disabled></button>
    <select id="target" aria-label="Target language"></select>
    <div class="seg" role="group" id="layout">
      <button type="button" data-layout="split" id="lySplit"></button>
      <button type="button" data-layout="text" id="lyText"></button>
      <button type="button" data-layout="pdf" id="lyPdf"></button>
    </div>
    <div class="seg" role="group">
      <button type="button" id="zoomOut" aria-label="Zoom out">−</button>
      <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
    </div>
    <a id="origLink" class="btn" target="_blank" rel="noopener" hidden></a>
    <button type="button" id="openFull" hidden></button>
    <label class="btn" id="openLbl"><span id="openTxt"></span><input type="file" id="file" accept="application/pdf,.pdf" hidden></label>
  </header>

  <main>
    <section id="drop" class="drop">
      <div class="drop-box">
        <p id="dropTxt"></p>
        <form id="urlForm">
          <input id="urlInput" type="url" placeholder="https://onlinejudge.org/external/124/12429.pdf" spellcheck="false">
          <button type="submit" class="primary" id="urlGo"></button>
        </form>
        <p class="msg" id="msg" hidden></p>
        <button type="button" class="primary" id="allow" hidden></button>
      </div>
    </section>
    <section id="pdfPane" class="pane pdf" aria-label="PDF"></section>
    <section id="textPane" class="pane text" aria-label="Text">
      <article id="text" class="doc"></article>
    </section>
  </main>

  <script src="../shared/i18n.js"></script>
  <script src="../shared/core.js"></script>
  <script src="../shared/pdf-layout.js"></script>
  <script type="module" src="reader.js"></script>
</body>
</html>
