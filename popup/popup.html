<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hiraku Judges Translator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1><img src="../icons/icon48.png" alt="" width="22" height="22"><span id="title"></span></h1>
  <button id="page" class="primary" type="button"></button>

  <label>
    <span id="lblTarget"></span>
    <select id="target"></select>
  </label>

  <label>
    <span id="lblService"></span>
    <select id="service">
      <option value="google">Google Translate</option>
      <option value="deepl">DeepL (API key)</option>
    </select>
  </label>

  <label id="keyRow" hidden>
    <span id="lblKey"></span>
    <input id="deeplKey" type="password" autocomplete="off" spellcheck="false" placeholder="xxxxxxxx-xxxx-...:fx">
  </label>

  <label>
    <span id="lblKeep"></span>
    <textarea id="keep" rows="2" spellcheck="false"></textarea>
    <small class="hint" id="keepHint"></small>
  </label>

  <label class="check">
    <input id="hoverOriginal" type="checkbox">
    <span id="lblHover"></span>
  </label>

  <button id="reader" class="secondary" type="button"></button>

  <p class="hint" id="hint"></p>

  <script src="../shared/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
